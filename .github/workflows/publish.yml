name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.1.0"
        required: true

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing: PyPI trusts this workflow, no token exists
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "v$version" || { echo "tag $tag but pyproject says $version"; exit 1; }
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Skip a version PyPI already has
        id: have
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if curl -sf "https://pypi.org/pypi/tapwright/$version/json" >/dev/null; then
            echo "tapwright $version is already on PyPI"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.have.outputs.skip != 'true'
