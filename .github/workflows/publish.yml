name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.1.0"
        required: true

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing: PyPI trusts this workflow, no token exists
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}  # through the environment, never into the script
        run: |
          tag="$TAG"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "v$version" || { echo "tag $tag but pyproject says $version"; exit 1; }
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      # A file PyPI already has is skipped, one by one: after a partial upload a rerun sends only what's missing
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
