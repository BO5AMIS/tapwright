[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapwright"
version = "1.5.1"
description = "Let LLM agents test apps on your real iPhone, from Windows, Linux or macOS. No Mac needed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "bo5amis" }]
keywords = ["iphone", "ios", "testing", "qa", "mcp", "ai-agents", "webdriveragent", "xctest", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pymobiledevice3>=11.50,<12",  # Apple's device protocols; device.py relies on its user-space tunnel
    "mcp>=2.3",
    "anyio>=4.5",  # runs everything on the event loop pymobiledevice3 needs (device.run)
    "starlette>=1.0",  # the daemon's HTTP and WebSocket app
    "uvicorn>=0.30",
    "wsproto>=1.2",  # uvicorn's WebSocket implementation (server.py uses ws="wsproto")
    "pillow",
]

[project.urls]
Homepage = "https://github.com/bo5amis/tapwright"
Documentation = "https://github.com/bo5amis/tapwright/tree/main/docs"
Issues = "https://github.com/bo5amis/tapwright/issues"

[project.optional-dependencies]
dev = ["pytest", "pyflakes"]
video = ["av>=14"]  # the H.264 live view (/video): decode the AirPlay stream, encode it again
ocr = ["rapidocr>=3.10", "onnxruntime>=1.20"]  # look with ocr: true: text read from the picture, on the CPU

[project.scripts]
tapwright = "tapwright.cli:main"

[tool.setuptools]
packages = ["tapwright"]

[tool.setuptools.package-data]
tapwright = ["viewer.html", "skill/*.md", "skill/references/*.md", "skill/agents/*.yaml"]
