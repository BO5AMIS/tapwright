[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapwright"
version = "0.1.0"
description = "Let LLM agents test apps on your real iPhone, from Windows, Linux or macOS. No Mac needed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pymobiledevice3>=11.50,<12",  # Apple's device protocols; device.py relies on its user-space tunnel
    "mcp>=2.3",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "pyflakes"]

[project.scripts]
tapwright = "tapwright.cli:main"

[tool.setuptools]
packages = ["tapwright"]
