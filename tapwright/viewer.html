<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Live view</title>
<link rel="icon" href="data:,">
<!-- The shared live view page: a client of docs/VIEWER-PROTOCOL.md. One file, inline CSS and
     script, no external references. It never names the tool that serves it: the tool's name comes
     in the status message (tool). The text between the video-block markers is shared byte for
     byte with other copies of this page. Change it only by agreement. -->
<style>
:root {
  color-scheme: light dark;
  --bg: #e9ecf1;
  --stage-hi: #ffffff;
  --stage-lo: #d9dee6;
  --panel: rgba(255, 255, 255, 0.72);
  --panel-solid: #ffffff;
  --line: rgba(17, 24, 39, 0.12);
  --text: #111827;
  --muted: #4b5563;
  --accent: #0a66d1;
  --btn: rgba(255, 255, 255, 0.9);
  --btn-line-hover: rgba(17, 24, 39, 0.32);
  --pressed: #dcebff;
  --dot-idle: #6b7480;
  --dot-live: #1f883d;
  --dot-wait: #9a6700;
  --dot-bad: #cf222e;
  --notice-bg: #fdecec;
  --notice-line: #c62828;
  --notice-text: #7a1212;
  /* The phone's body: a brushed-metal edge around a black bezel. It is drawn, never a photo. */
  --metal-1: #c9ccd1;
  --metal-2: #8d9197;
  --metal-3: #eceef1;
  --bezel: #050506;
  --frame-shadow: 0 30px 60px -20px rgba(15, 23, 42, 0.45), 0 18px 36px -18px rgba(15, 23, 42, 0.35);
  /* Marks and overlay labels sit on the phone's picture, which doesn't follow the theme, so
     they keep one set of colours: dark text on a light fill, readable on any picture. */
  --agent: #4cc2ff;
  --person: #8be28b;
  --fail: #ff6b6b;
  --on-mark: #000000;
  --label-bg: #ffd60a;
  --label-text: #000000;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0d11;
    --stage-hi: #2d3440;
    --stage-lo: #0b0d11;
    --panel: rgba(22, 26, 33, 0.78);
    --panel-solid: #161a21;
    --line: rgba(255, 255, 255, 0.1);
    --text: #e8ebf0;
    --muted: #9aa4b2;
    --accent: #7cc4ff;
    --btn: rgba(255, 255, 255, 0.06);
    --btn-line-hover: rgba(255, 255, 255, 0.32);
    --pressed: rgba(124, 196, 255, 0.18);
    --dot-live: #3fb950;
    --dot-wait: #d29922;
    --dot-bad: #ff6b6b;
    --notice-bg: #3a1c1c;
    --notice-line: #ff6b6b;
    --notice-text: #ffd7d7;
    --metal-1: #80858d;
    --metal-2: #3d4148;
    --metal-3: #c2c7ce;
    --frame-shadow: 0 40px 80px -24px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 60px 0 rgba(124, 196, 255, 0.06);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-columns: minmax(0, 1fr);
  background: var(--bg) radial-gradient(120% 90% at 50% 38%, var(--stage-hi) 0%, var(--stage-lo) 70%) no-repeat;
  color: var(--text);
  font: 14px/1.4 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  overflow: hidden;
}
#bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  margin: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  padding: 6px 6px 6px 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
}
#heading {
  flex: none;
  margin: 0;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -0.01em;
  line-height: 1.4;
}
#statusline {
  flex: 1 1 200px;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
}
#dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--dot-idle);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot-idle) 22%, transparent);
}
#dot.live { background: var(--dot-live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot-live) 22%, transparent); }
#dot.wait { background: var(--dot-wait); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot-wait) 22%, transparent); }
#dot.bad { background: var(--dot-bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot-bad) 22%, transparent); }
#status {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
#announce {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
#tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
button, select {
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--btn);
  color: var(--text);
  font: inherit;
  font-weight: 550;
  cursor: pointer;
}
select { padding-right: 8px; }
/* The list a select opens is drawn by the system, on its own background: the options get the theme's
   colours, or dark mode drew the page's light text on the system's white (seen by the owner, 2026-11-11). */
select option { background: #ffffff; color: #111827; }
@media (prefers-color-scheme: dark) {
  select option { background: #1b2029; color: #e8ebf0; }
}
button:hover, select:hover { border-color: var(--btn-line-hover); }
button[aria-pressed="true"] { background: var(--pressed); border-color: var(--accent); color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.q { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); padding-left: 6px; }
@media (pointer: coarse) {
  button, select { min-height: 44px; }
  #statusline { height: 44px; }
}
@media (max-width: 560px) {
  #bar { border-radius: 18px; padding: 8px 8px 8px 14px; gap: 4px 10px; }
  #heading { font-size: 14px; }
  #statusline { flex: 1 1 0; height: 28px; }
  #tools { flex: 1 0 100%; gap: 6px; }
  #tools > * { flex: none; }
  button, select { min-height: 34px; padding: 0 12px; }
  label.q { padding-left: 0; font-size: 0; gap: 0; }   /* the select keeps its own label for screen readers */
  label.q select { font-size: 14px; }
  /* short visible names on a narrow screen; the buttons' aria-labels keep the full ones */
  #vol-down, #vol-up { font-size: 0; padding: 0 12px; }
  #vol-down::after { content: "Vol \2212"; font-size: 14px; }
  #vol-up::after { content: "Vol +"; font-size: 14px; }
}
@media (max-width: 560px) and (pointer: coarse) {
  button, select { min-height: 40px; }
}
#stage {
  position: relative;
  min-height: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
}
/* The drawn phone. #frame inside it is the picture's own rectangle: every click is mapped from it,
   so nothing here may move it or catch an event over it. The bezel and the rounded screen corners
   are painted on top by #glass, which lets events through to the picture, corners included. */
#device {
  --b: 14px;     /* from the screen's edge to the body's outer edge */
  --edge: 3px;   /* the metal rim, part of --b */
  --r: 44px;     /* the screen's corner radius */
  --s: 200px;    /* the screen's short side */
  position: relative;
  padding: var(--b);
  border-radius: calc(var(--r) + var(--b));
  background: linear-gradient(135deg, var(--metal-3) 0%, var(--metal-1) 22%, var(--metal-2) 50%, var(--metal-1) 78%, var(--metal-3) 100%);
  box-shadow: var(--frame-shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.35), inset 0 0 0 2px rgba(0, 0, 0, 0.25);
}
#frame {
  position: relative;
  z-index: 1;
  width: 200px;
  height: 433px;
  overflow: hidden;
  outline: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  transform: translateZ(0); /* its own layer: a new picture repaints only the screen */
}
#frame.can-point { cursor: crosshair; }
/* The picture's layers are clipped to the rounded screen. They take no events, so a click in a clipped
   corner still lands on #frame's plain rectangle and maps as before. */
.pic, #empty, #overlay, #marks, #trail { clip-path: inset(0 round var(--r)); }
#empty { background: #000; }
#glass {
  position: absolute;
  z-index: 2;
  left: calc(var(--b) + 1px);
  top: calc(var(--b) + 1px);
  right: calc(var(--b) + 1px);
  bottom: calc(var(--b) + 1px);
  border-radius: calc(var(--r) - 1px);
  /* the black bezel, spread from the screen's rounded edge: it also covers the picture's square corners,
     and its inner 1 px overlaps the picture so no colour shows along the curve */
  box-shadow: 0 0 0 calc(var(--b) - var(--edge) + 1px) var(--bezel), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
  pointer-events: none;
}
#frame:focus-visible + #glass { box-shadow: 0 0 0 calc(var(--b) - var(--edge) + 1px) var(--bezel), inset 0 0 0 2px var(--accent); }
#island {
  position: absolute;
  left: 50%;
  top: calc(var(--s) * 0.026);
  width: calc(var(--s) * 0.293);
  height: calc(var(--s) * 0.086);
  transform: translateX(-50%);
  border-radius: 999px;
  background: #000;
  pointer-events: none;
}
#device.wide #island {
  left: calc(var(--s) * 0.026);
  top: 50%;
  width: calc(var(--s) * 0.086);
  height: calc(var(--s) * 0.293);
  transform: translateY(-50%);
}
#device.no-island #island { display: none; }
/* Side keys: drawn on the body's edge. They take a click only where the server accepts the key
   (status.accepts), and then only as a shortcut for the labelled buttons in the toolbar. */
.key {
  position: absolute;
  z-index: 0;
  padding: 0;
  min-height: 0;
  border: 0;
  border-radius: 2px;
  background: var(--metal-1);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25), 0 0 0 0.5px rgba(0, 0, 0, 0.4);
  pointer-events: none;
  cursor: default;
}
.key.live { pointer-events: auto; cursor: pointer; }
.key.live:hover { filter: brightness(1.12); }
.key.live:active { transform: scale(0.96); }
#key-action { left: -4px; width: 5px; top: 17%; height: 4%; }
#key-vol-up { left: -4px; width: 5px; top: 25%; height: 7.5%; }
#key-vol-down { left: -4px; width: 5px; top: 34%; height: 7.5%; }
#key-side { right: -4px; width: 5px; top: 27%; height: 11%; }
/* Landscape: the phone turned with its top to the left, so the left keys are at the bottom. */
#device.wide #key-action { left: 17%; top: auto; bottom: -4px; width: 4%; height: 5px; }
#device.wide #key-vol-up { left: 25%; top: auto; bottom: -4px; width: 7.5%; height: 5px; }
#device.wide #key-vol-down { left: 34%; top: auto; bottom: -4px; width: 7.5%; height: 5px; }
#device.wide #key-side { left: 27%; right: auto; top: -4px; width: 11%; height: 5px; }
.pic {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
  -webkit-user-drag: none;
}
#empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  text-align: center;
  color: #8b93a1;
}
#frame.has-frame #empty { display: none; }
#overlay, #marks, #trail { position: absolute; inset: 0; pointer-events: none; }
#trail { width: 100%; height: 100%; }
#overlay.stale { opacity: 0.3; }
.box {
  position: absolute;
  outline: 1px solid rgba(255, 214, 10, 0.9);
  outline-offset: -1px;
}
.box > span {
  position: absolute;
  left: -1px;
  bottom: 100%; /* above the box, so it doesn't cover what the box marks */
  max-width: 100%;
  overflow: hidden;
  padding: 0 2px;
  font: 10px/12px ui-monospace, Consolas, monospace;
  color: var(--label-text);
  background: var(--label-bg);
  white-space: nowrap;
}
.mark {
  --c: var(--agent);
  position: absolute;
  animation: markfade 1.6s ease-out forwards;
}
.mark.person { --c: var(--person); }
.mark.fail { --c: var(--fail); animation-duration: 2.6s; }
.mark .tag {
  position: absolute;
  padding: 1px 7px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  line-height: 16px;
  white-space: nowrap;
  color: var(--on-mark);
  background: var(--c);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
}
.mark.ring { width: 0; height: 0; }
.mark.ring::before {
  content: "";
  position: absolute;
  left: -16px;
  top: -16px;
  width: 32px;
  height: 32px;
  border: 3px solid var(--c);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(0, 0, 0, 0.6);
}
.mark.ring .tag { left: 20px; top: -8px; }
/* near the right edge the tag goes on the ring's left, so it stays on the picture */
.mark.ring.flip .tag { left: auto; right: 20px; }
.mark.rect {
  border: 2px solid var(--c);
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(0, 0, 0, 0.6);
}
.mark.rect .tag { left: -2px; top: -20px; }
.mark.pill .tag { position: absolute; left: 8px; top: 8px; }
.mark.pending { animation: none; opacity: 0.55; }
.mark.pending.gone { opacity: 0; transition: opacity 0.3s ease-out; }
@keyframes markfade {
  0% { opacity: 1; }
  70% { opacity: 1; }
  100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .mark { animation: none; }
  .key.live:active { transform: none; }
}
#notice {
  position: absolute;
  z-index: 3;
  left: 50%;
  bottom: 14px;
  max-width: calc(100% - 32px);
  transform: translateX(-50%);
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--notice-bg);
  border: 1px solid var(--notice-line);
  color: var(--notice-text);
  opacity: 0;
  pointer-events: none;
}
#notice.on { opacity: 1; }
#notice { bottom: auto; top: 12px; }
/* The More menu: everything technical (Details, boxes, picture quality, the phone's keys), out of the bar. Drawn
   by the page itself, so it follows the theme; a native select's list is drawn by the system (light text on white
   in dark mode on Windows, seen by the owner). */
.more { position: relative; }
#more-btn[aria-expanded="true"] { background: var(--pressed); border-color: var(--accent); color: var(--accent); }
#more-menu {
  position: absolute;
  z-index: 10;
  right: 0;
  top: calc(100% + 14px);
  width: 260px;
  max-width: calc(100vw - 32px);
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 14px;
  border-radius: 18px;
  background: var(--panel-solid);
  border: 1px solid var(--line);
  box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.45);
}
.menu-group { display: flex; flex-direction: column; gap: 8px; }
.menu-label { color: var(--text); opacity: 0.9; font-size: 12px; font-weight: 650; letter-spacing: 0.02em; }
.menu-row { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: flex; padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 999px; }
.seg button { flex: 1; min-height: 32px; padding: 0 10px; border: 0; background: transparent; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel-solid); }
#phone-keys .menu-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
#phone-keys button { padding: 0 6px; }
/* short visible names in the menu; the buttons' aria-labels keep the full ones */
#more-menu #vol-down, #more-menu #vol-up { font-size: 0; }
#more-menu #vol-down::after { content: "Vol \2212"; font-size: 14px; }
#more-menu #vol-up::after { content: "Vol +"; font-size: 14px; }
@media (max-width: 560px) {
  #more-menu { position: fixed; left: 16px; right: 16px; width: auto; max-width: none; }
}
/* Presentation view (VIEWER-PROTOCOL 1.4): people see the step in plain words under the phone and a ripple at
   the touch. The element's name beside a touch, the boxes and the coordinates are the Details view's. */
body:not(.details) .mark .tag { display: none; }
.mark.ring::after {
  content: "";
  position: absolute;
  left: -16px;
  top: -16px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid var(--c);
  animation: ripple 0.7s ease-out forwards;
}
@keyframes ripple {
  0% { transform: scale(0.6); opacity: 0.9; }
  100% { transform: scale(2.4); opacity: 0; }
}
#caption {
  position: absolute;
  z-index: 3;
  left: 50%;
  bottom: 18px;
  max-width: calc(100% - 32px);
  transform: translate(-50%, 6px);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px 8px 12px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: 0 6px 20px -8px rgba(0, 0, 0, 0.35);
  color: var(--text);
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease-out, transform 0.2s ease-out;
}
#caption.on { opacity: 1; transform: translate(-50%, 0); }
#caption::before {
  content: "";
  flex: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--agent);
}
#caption.person::before { background: var(--person); }
#caption.fail { border-color: var(--notice-line); color: var(--notice-text); background: var(--notice-bg); }
#caption.fail::before { background: var(--fail); }
#steps {
  position: absolute;
  z-index: 4;
  top: 12px;
  right: 16px;
  bottom: 64px;
  width: 320px;
  max-width: calc(100% - 32px);
  display: flex;
  flex-direction: column;
  border-radius: 20px;
  background: var(--panel-solid);
  border: 1px solid var(--line);
  box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.45);
  overflow: hidden;
}
.steps-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 10px 18px;
  border-bottom: 1px solid var(--line); }
.steps-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
#steps-close { min-height: 32px; width: 32px; padding: 0; font-size: 20px; line-height: 1; }
#steps-list { list-style: none; margin: 0; padding: 6px 8px 10px; overflow-y: auto; flex: 1; }
#steps-list li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 12px; }
#steps-list li + li { margin-top: 2px; }
#steps-list .ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 15px/1 "Segoe UI Symbol", "Apple Symbols", system-ui, sans-serif;
  color: var(--on-mark); background: var(--agent); }
#steps-list li.person .ico { background: var(--person); }
#steps-list li.fail .ico { background: var(--fail); }
#steps-list .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#steps-list li.fail .txt { color: var(--dot-bad); }
#steps-list .ago { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
#steps-empty { margin: 0; padding: 18px; color: var(--muted); }
#steps-list:not(:empty) + #steps-empty { display: none; }
@media (max-width: 560px) {
  #steps { top: auto; left: 12px; right: 12px; bottom: 72px; width: auto; max-width: none; height: 48%; }
}
/* The person's OK (VIEWER-PROTOCOL 1.5): a small dialog over the phone area when the agent touches something the safety
   policy guards. Same tokens as the Steps drawer and the More menu, so it follows the theme. */
#confirm {
  position: absolute;
  z-index: 6;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(15, 23, 42, 0.38);
}
#confirm-card {
  width: min(340px, 100%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 18px;
  border-radius: 20px;
  background: var(--panel-solid);
  border: 1px solid var(--line);
  box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.45);
}
#confirm-title { margin: 0; color: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: 0.02em; }
#confirm-text { margin: 0; font-size: 17px; font-weight: 650; overflow-wrap: anywhere; }
#confirm-word { margin: 0; color: var(--muted); }
#confirm-word:empty { display: none; }
#confirm-actions { display: flex; gap: 8px; margin-top: 8px; }
#confirm-actions button { flex: 1; min-height: 40px; }
#confirm-allow { background: var(--accent); border-color: var(--accent); color: var(--panel-solid); }
@media (prefers-reduced-motion: reduce) {
  .mark.ring::after { animation: none; opacity: 0; }
  #caption { transition: none; }
}
</style>
</head>
<body>
<header id="bar">
  <h1 id="heading">Live view</h1>
  <div id="statusline">
    <span id="dot" aria-hidden="true"></span>
    <span id="status">Connecting</span>
    <span id="announce" role="status" aria-live="polite"></span>
  </div>
  <div id="tools" role="toolbar" aria-label="Viewer controls">

    }

  function onFrame(frame, d) {

      ctx.drawImage(frame, 0, 0);
      counts.frames++;
      if (!visible) {
        visible = true;
        canvas.style.display = "";
        var pic = io.picture();
        if (pic) pic.style.display = "none";

      }
    } finally {
      frame.close();
    }
  }

  /* A decoder error: reset, ask for a key frame and wait for it; too many errors give up. */
  function onDecoderError(err, d) {

      return;

      } else {

        d.configure(cfg);

      fail("decoder");
      return;
    }

    keyAsked = true;
    sendKey();
  }

    update: update,
    stop: stop,
    stats: function () {
      return {

        keyRequests: counts.keyRequests, fallbacks: counts.fallbacks, hardware: counts.hardware,

  function release(el) {
    if (viaPointer) letGo(el);
  }
  $("pause").addEventListener("click", function () {
    var next = !paused;
    if (send({ type: "pause", on: next })) {
      paused = next;
      renderStatus();
    }
    release(this);
  });
  $("boxes").addEventListener("click", function () {
    overlayOn = !overlayOn;
    this.setAttribute("aria-pressed", overlayOn ? "true" : "false");
    if (!overlayOn) overlay = null;
    drawOverlay();
    send({ type: "overlay", on: overlayOn });
    release(this);
  });
  $("quality").addEventListener("change", function () {
    send({ type: "quality", preset: this.value });
    release(this);
  });
  $("home").addEventListener("click", function () {
    send({ type: "button", name: "home" });
    release(this);
  });
  $("vol-up").addEventListener("click", function () {
    send({ type: "button", name: "volumeUp" });
    release(this);
  });
  $("vol-down").addEventListener("click", function () {
    send({ type: "button", name: "volumeDown" });
    release(this);
  });
  /* The drawn keys are a mouse shortcut for the toolbar's buttons (which stay the keyboard's way). */
  $("key-vol-up").addEventListener("click", function () { if (accepts.volume) $("vol-up").click(); });
  $("key-vol-down").addEventListener("click", function () { if (accepts.volume) $("vol-down").click(); });

  /* The More menu. The picture quality is three buttons drawn by the page; the select stays (hidden) as the one
     source of the value, so whatever drives it keeps working. */
  function syncQuality() {
    var v = $("quality").value;
    var all = $("quality-seg").querySelectorAll("button");
    for (var i = 0; i < all.length; i++) all[i].setAttribute("aria-pressed", all[i].getAttribute("data-q") === v ? "true" : "false");
  }
  $("quality-seg").addEventListener("click", function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest("button[data-q]") : null;
    if (!b) return;
    var sel = $("quality");
    if (sel.value !== b.getAttribute("data-q")) {
      sel.value = b.getAttribute("data-q");
      sel.dispatchEvent(new Event("change"));
    }
    syncQuality();
  });
  $("quality").addEventListener("change", syncQuality);
  function setMore(open) {
    var menu = $("more-menu");
    /* on a narrow screen the menu spans the width, just under the button */
    menu.style.top = open && window.innerWidth <= 560 ? Math.round($("bar").getBoundingClientRect().bottom + 12) + "px" : "";
    menu.hidden = !open;
    $("more-btn").setAttribute("aria-expanded", open ? "true" : "false");
  }
  $("more-btn").addEventListener("click", function () {
    setMore($("more-menu").hidden);
    release(this);
  });
  document.addEventListener("pointerdown", function (ev) {
    if (!$("more-menu").hidden && ev.target && !ev.target.closest(".more")) setMore(false);
  }, true);
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && !$("more-menu").hidden) {
      setMore(false);
      $("more-btn").focus();
    }
  });

  /* Steps drawer and the Details view (VIEWER-PROTOCOL 1.4, presentation view). Details is remembered per
     browser; storage may be unavailable (a private window), and then it simply starts off. */
  function setSteps(open) {
    $("steps").hidden = !open;
    $("steps-btn").setAttribute("aria-expanded", open ? "true" : "false");
    if (open) renderSteps();
  }
  $("steps-btn").addEventListener("click", function () {
    setSteps($("steps").hidden);
    release(this);
  });
  $("steps-close").addEventListener("click", function () {
    setSteps(false);
    $("steps-btn").focus();
  });
  function setDetails(on) {
    document.body.classList.toggle("details", on);
    $("details").setAttribute("aria-pressed", on ? "true" : "false");
    try { localStorage.setItem("viewer.details", on ? "1" : "0"); } catch (e) { /* not kept */ }
    renderStatus();
  }
  $("details").addEventListener("click", function () {
    setDetails(!document.body.classList.contains("details"));
    release(this);
  });
  try { if (localStorage.getItem("viewer.details") === "1") setDetails(true); } catch (e) { /* starts off */ }

  /* Drag trail: the path under the pointer while a person drags, on its own canvas so it
     never mixes with the action marks. It is drawn in the person's colour with a dark edge,
     which reads on any picture (the picture doesn't follow the theme). */
  var TRAIL_CLEAR_MS = 400;
  var trailTimer = 0;
  function clearTrail() {
    clearTimeout(trailTimer);
    trailTimer = 0;
    if (trailCtx) trailCtx.clearRect(0, 0, trailW, trailH);
  }
  function drawTrail(points) {
    if (!trailCtx || points.length < 2) return;
    trailCtx.clearRect(0, 0, trailW, trailH);
    trailCtx.lineCap = "round";
    trailCtx.lineJoin = "round";
    var passes = [["rgba(0, 0, 0, 0.55)", 7], ["#8be28b", 4]];
    for (var k = 0; k < passes.length; k++) {
      trailCtx.beginPath();
      for (var i = 0; i < points.length; i++) {
        var x = points[i][1] * trailW;
        var y = points[i][2] * trailH;
        if (i === 0) trailCtx.moveTo(x, y);
        else trailCtx.lineTo(x, y);
      }
      trailCtx.strokeStyle = passes[k][0];
      trailCtx.lineWidth = passes[k][1];
      trailCtx.stroke();
    }
  }

  /* Pointer: one finger or the mouse, sent as a path on release. A move is stored only when
     at least MOVE_GAP_MS have passed since the last stored point, so a fast mouse can't fill
     the path with near-duplicates; MAX_POINTS caps the whole path, the last point included. */
  var MOVE_GAP_MS = 16;
  var MAX_POINTS = 300;
  var drag = null;
  function fractionOf(ev) {
    var r = frame.getBoundingClientRect();
    return [
      round4(clamp01((ev.clientX - r.left) / Math.max(1, r.width))),
      round4(clamp01((ev.clientY - r.top) / Math.max(1, r.height)))
    ];
  }
  frame.addEventListener("pointerdown", function (ev) {
    if (!canPoint() || drag || !ev.isPrimary) return;
    if (ev.pointerType === "mouse" && ev.button !== 0) return;
    ev.preventDefault();
    var active = document.activeElement;
    if (active && active !== document.body && typeof active.blur === "function") active.blur();
    try { frame.setPointerCapture(ev.pointerId); } catch (e) { /* not capturable */ }
    clearTrail();
    var p = fractionOf(ev);
    drag = { id: ev.pointerId, t0: ev.timeStamp, last: 0, far: false, pts: [[0, p[0], p[1]]] };
  });
  frame.addEventListener("pointermove", function (ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    var dt = ev.timeStamp - drag.t0;
    if (dt - drag.last < MOVE_GAP_MS) return;
    var p = fractionOf(ev);
    var pt = [Math.round(dt), p[0], p[1]];
    if (drag.pts.length >= MAX_POINTS - 1) drag.pts[drag.pts.length - 1] = pt;
    else drag.pts.push(pt);
    drag.last = dt;
    /* No trail for a tap or a hold: its ring comes when it is released. */
    if (!drag.far && !isTapPath(drag.pts)) drag.far = true;
    if (drag.far) drawTrail(drag.pts);
  });
  frame.addEventListener("pointerup", function (ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    var p = fractionOf(ev);
    drag.pts.push([Math.max(0, Math.round(ev.timeStamp - drag.t0)), p[0], p[1]]);
    var points = drag.pts;
    drag = null;
    var sent = send({ type: "gesture", points: points });
    var tap = isTapPath(points);
    if (!tap) {
      drawTrail(points);
      clearTimeout(trailTimer);
      trailTimer = setTimeout(clearTrail, TRAIL_CLEAR_MS);
    }
    /* A tap or long press shows its ring at once; a drag has no single point. */
    if (sent && (accepts.tap || accepts.longPress) && tap) {
      var end = points[points.length - 1];
      addPending(end[1], end[2]);
    }
  });
  frame.addEventListener("pointercancel", function (ev) {
    if (drag && ev.pointerId === drag.id) {
      drag = null;
      clearTrail();
    }
  });

  /* Mouse wheel: events within 120 ms become one scroll. Each share is held to 0.8 of the
     frame (so a fast fling can't ask for more than the phone's screen), which also keeps it
     inside the protocol's -1..1. A scroll that comes to nothing is not sent. */
  var WHEEL_MAX = 0.8;
  var wheel = null;
  function share(v) {
    return round4(Math.max(-WHEEL_MAX, Math.min(WHEEL_MAX, v)));
  }
  function flushWheel() {
    var w = wheel;
    wheel = null;
    if (!w) return;
    var dx = share(w.dx);
    var dy = share(w.dy);
    if (dx === 0 && dy === 0) return;
    send({ type: "scroll", x: round4(w.x), y: round4(w.y), dx: dx, dy: dy });
  }
  frame.addEventListener("wheel", function (ev) {
    if (!accepts.scroll) return;
    ev.preventDefault();
    var r = frame.getBoundingClientRect();
    var k = ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? r.height : 1;
    if (!wheel) {
      wheel = {
        x: clamp01((ev.clientX - r.left) / Math.max(1, r.width)),
        y: clamp01((ev.clientY - r.top) / Math.max(1, r.height)),
        dx: 0,
        dy: 0
      };
      setTimeout(flushWheel, 120);
    }
    wheel.dx += (ev.deltaX * k) / Math.max(1, r.width);
    wheel.dy += (ev.deltaY * k) / Math.max(1, r.height);
  }, { passive: false });

  /* Keyboard and paste: only when the page itself has focus, not a toolbar control. */
  var typed = "";
  var typedTimer = 0;
  function flushText() {
    clearTimeout(typedTimer);
    typedTimer = 0;
    if (!typed) return;
    var t = typed;
    typed = "";
    send({ type: "text", text: t });
  }
  function inToolbar(target) {
    return !!(target && target.closest && target.closest("#bar"));
  }
  document.addEventListener("keydown", function (ev) {
    if (ev.defaultPrevented || ev.isComposing) return;
    if (inToolbar(ev.target)) {
      if (ev.key === "Escape") letGo(document.activeElement);
      return;
    }
    /* Ctrl, Alt and Meta make shortcuts, which stay the browser's. But AltGr (Alt Gr on a
       Windows layout reports Ctrl and Alt together) types characters such as @ or a with an
       accent, and those go to the phone. */
    var altGr = typeof ev.getModifierState === "function" && ev.getModifierState("AltGraph");
    if (ev.metaKey || ((ev.ctrlKey || ev.altKey) && !altGr)) return;
    if (ev.key === "Backspace" && accepts.backspace) {
      ev.preventDefault();
      flushText();
      send({ type: "key", key: "backspace" });
    } else if (ev.key === "Enter" && accepts.enter) {
      ev.preventDefault();
      flushText();
      send({ type: "key", key: "enter" });
    } else if (accepts.text && Array.from(ev.key).length === 1) {
      ev.preventDefault();
      typed += ev.key;
      clearTimeout(typedTimer);
      typedTimer = setTimeout(flushText, 300);
    }
  });
  document.addEventListener("paste", function (ev) {
    if (!accepts.text || inToolbar(ev.target)) return;
    var text = ev.clipboardData ? ev.clipboardData.getData("text") : "";
    if (!text) return;
    ev.preventDefault();
    flushText();
    send({ type: "text", text: text });
  });

  /* Video: the self-contained block above, wired to this page. */
  var video = createVideoBlock({
    socketUrl: function () { return endpoint("/video", true); },
    accepts: function () { return !!accepts.video; },
    picture: function () { return screenEl; },
    onVideoConfig: function (c) {
      shown.rev = null;
      shown.size = null;
      shown.coverage = c.coverage || "";
      shown.natural = { w: c.width, h: c.height };
      layout();
      drawOverlay();
      renderStatus();
    },
    onVideoStarted: function () {
      videoOn = true;
      setStream(false);
      streamLive = false;
      haveFrame = true;
      frame.classList.add("has-frame");
      layout();
      startVideoFps();
      renderStatus();
    },
    onVideoStopped: function () {
      videoOn = false;
      stopVideoFps();
      setStream(true);
      renderStatus();
    }
  });

  /* While video shows, the status line's rate is the video's own: frames drawn in the last second.
     (The server's fps is its JPEG stream's.) */
  function startVideoFps() {
    stopVideoFps();
    var last = video.stats().frames;
    var lastAt = Date.now();
    videoFps = null;
    videoFpsTimer = setInterval(function () {
      var now = Date.now();
      var frames = video.stats().frames;
      var seconds = (now - lastAt) / 1000;
      if (seconds > 0) videoFps = Math.max(0, (frames - last) / seconds);
      last = frames;
      lastAt = now;
      renderStatus();
    }, 1000);
  }
  function stopVideoFps() {
    if (videoFpsTimer !== null) clearInterval(videoFpsTimer);
    videoFpsTimer = null;
    videoFps = null;
  }

  layout();
  renderStatus();
  connectWs();
  runStream();
})();
</script>
</body>
</html>
