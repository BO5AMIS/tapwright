<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Live view</title>
<link rel="icon" href="data:,">
<!-- The shared live view page: a client of docs/VIEWER-PROTOCOL.md. One file, inline CSS and
     script, no external references. It never names the tool that serves it: the tool's name comes
     in the status message (tool). The text between the video-block markers is shared byte for
     byte with other copies of this page. Change it only by agreement. -->
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f7;
  --panel: #ffffff;
  --line: #d0d5dd;
  --text: #16191f;
  --muted: #4b5563;
  --accent: #0b63c5;
  --btn: #f1f3f6;
  --btn-line-hover: #98a2b3;
  --pressed: #dbeafe;
  --dot-idle: #6b7480;
  --dot-live: #1f883d;
  --dot-wait: #9a6700;
  --dot-bad: #cf222e;
  --notice-bg: #fdecec;
  --notice-line: #c62828;
  --notice-text: #7a1212;
  --frame-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
  /* Marks and overlay labels sit on the phone's picture, which doesn't follow the theme, so
     they keep one set of colours: dark text on a light fill, readable on any picture. */
  --agent: #4cc2ff;
  --person: #8be28b;
  --fail: #ff6b6b;
  --on-mark: #000000;
  --label-bg: #ffd60a;
  --label-text: #000000;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --line: #2a313c;
    --text: #e6e9ef;
    --muted: #9aa4b2;
    --accent: #7cc4ff;
    --btn: #1f2630;
    --btn-line-hover: #3b4554;
    --pressed: #1d3550;
    --dot-live: #3fb950;
    --dot-wait: #d29922;
    --dot-bad: #ff6b6b;
    --notice-bg: #3a1c1c;
    --notice-line: #ff6b6b;
    --notice-text: #ffd7d7;
    --frame-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  background: var(--bg);
  color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}
#bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  padding: 8px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
#heading {
  flex: none;
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
}
#statusline {
  flex: 1 1 220px;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
}
#dot {
  flex: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--dot-idle);
}
#dot.live { background: var(--dot-live); }
#dot.wait { background: var(--dot-wait); }
#dot.bad { background: var(--dot-bad); }
#status {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: var(--muted);
}
#announce {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
#tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
button, select {
  min-height: 36px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--btn);
  color: var(--text);
  font: inherit;
  cursor: pointer;
}
button:hover, select:hover { border-color: var(--btn-line-hover); }
button[aria-pressed="true"] { background: var(--pressed); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.q { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
@media (pointer: coarse) {
  button, select { min-height: 44px; }
  #statusline { height: 44px; }
}
#stage {
  position: relative;
  min-height: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
}
#frame {
  position: relative;
  width: 200px;
  height: 433px;
  background: #000;
  border-radius: 10px;
  box-shadow: 0 0 0 1px var(--line), var(--frame-shadow);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#frame.can-point { cursor: crosshair; }
.pic {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
  -webkit-user-drag: none;
}
#empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  text-align: center;
  color: #aab2bf;
}
#frame.has-frame #empty { display: none; }
#overlay, #marks, #trail { position: absolute; inset: 0; pointer-events: none; }
#trail { width: 100%; height: 100%; }
#overlay.stale { opacity: 0.3; }
.box {
  position: absolute;
  outline: 1px solid rgba(255, 214, 10, 0.9);
  outline-offset: -1px;
}
.box > span {
  position: absolute;
  left: -1px;
  bottom: 100%; /* above the box, so it doesn't cover what the box marks */
  max-width: 100%;
  overflow: hidden;
  padding: 0 2px;
  font: 10px/12px ui-monospace, Consolas, monospace;
  color: var(--label-text);
  background: var(--label-bg);
  white-space: nowrap;
}
.mark {
  --c: var(--agent);
  position: absolute;
  animation: markfade 1.6s ease-out forwards;
}
.mark.person { --c: var(--person); }
.mark.fail { --c: var(--fail); animation-duration: 2.6s; }
.mark .tag {
  position: absolute;
  padding: 1px 6px;
  border-radius: 6px;
  font-size: 11px;
  line-height: 16px;
  white-space: nowrap;
  color: var(--on-mark);
  background: var(--c);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
}
.mark.ring { width: 0; height: 0; }
.mark.ring::before {
  content: "";
  position: absolute;
  left: -16px;
  top: -16px;
  width: 32px;
  height: 32px;
  border: 3px solid var(--c);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(0, 0, 0, 0.6);
}
.mark.ring .tag { left: 20px; top: -8px; }
.mark.rect {
  border: 2px solid var(--c);
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(0, 0, 0, 0.6);
}
.mark.rect .tag { left: -2px; top: -20px; }
.mark.pill .tag { position: absolute; left: 8px; top: 8px; }
.mark.pending { animation: none; opacity: 0.55; }
.mark.pending.gone { opacity: 0; transition: opacity 0.3s ease-out; }
@keyframes markfade {
  0% { opacity: 1; }
  70% { opacity: 1; }
  100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .mark { animation: none; }
}
#notice {
  position: absolute;
  left: 50%;
  bottom: 12px;
  max-width: calc(100% - 32px);
  transform: translateX(-50%);
  padding: 6px 12px;
  border-radius: 8px;
  background: var(--notice-bg);
  border: 1px solid var(--notice-line);
  color: var(--notice-text);
  opacity: 0;
  pointer-events: none;
}
#notice.on { opacity: 1; }
</style>
</head>
<body>
<header id="bar">
  <h1 id="heading">Live view</h1>
  <div id="statusline">
    <span id="dot" aria-hidden="true"></span>
    <span id="status">Connecting</span>
    <span id="announce" role="status" aria-live="polite"></span>
  </div>
  <div id="tools" role="toolbar" aria-label="Viewer controls">
    <button type="button" id="pause" aria-pressed="false">Pause agent</button>
    <button type="button" id="boxes" aria-pressed="false" hidden>Boxes</button>
    <label class="q" id="quality-wrap" hidden>Quality
      <select id="quality" aria-label="Stream quality">
        <option value="sharp">Sharp</option>
        <option value="balanced" selected>Balanced</option>
        <option value="light">Light</option>
      </select>
    </label>
    <button type="button" id="home" hidden>Home</button>
    <button type="button" id="vol-down" hidden>Volume down</button>
    <button type="button" id="vol-up" hidden>Volume up</button>
  </div>
</header>
<main id="stage">
  <div id="frame" tabindex="0" role="img" aria-label="Live phone screen">
    <img id="screen" class="pic" alt="">
    <div id="empty">Waiting for the first frame</div>
    <div id="overlay" aria-hidden="true"></div>
    <canvas id="trail" aria-hidden="true"></canvas>
    <div id="marks" aria-hidden="true"></div>
  </div>
  <div id="notice" role="alert"></div>
</main>
<script>
"use strict";

/* parser:start */
var CRLF2 = new Uint8Array([13, 10, 13, 10]);

function boundaryFromContentType(contentType) {
  var m = /boundary=(?:"([^"]+)"|([^;\s]+))/i.exec(contentType || "");
  return m ? (m[1] || m[2]) : "frame";
}

function createParserState(boundary) {
  var enc = new TextEncoder();
  return {
    delim: enc.encode("--" + boundary),
    closer: enc.encode("\r\n--" + boundary),
    mode: "preamble",
    buf: new Uint8Array(0),
    headers: null,
    length: -1
  };
}

function concatBytes(a, b) {
  if (a.length === 0) return b;
  var out = new Uint8Array(a.length + b.length);
  out.set(a, 0);
  out.set(b, a.length);
  return out;
}

function indexOfBytes(hay, needle, from) {
  var n = needle.length;
  var last = hay.length - n;
  var first = needle[0];
  for (var i = from || 0; i <= last; i++) {
    if (hay[i] !== first) continue;
    var j = 1;
    while (j < n && hay[i + j] === needle[j]) j++;
    if (j === n) return i;
  }
  return -1;
}

function parsePartHeaders(bytes) {
  var text = new TextDecoder().decode(bytes);
  var lines = text.split("\r\n");
  var headers = {};
  for (var i = 0; i < lines.length; i++) {
    var at = lines[i].indexOf(":");
    if (at > 0) headers[lines[i].slice(0, at).trim().toLowerCase()] = lines[i].slice(at + 1).trim();
  }
  return headers;
}

/* Feed one chunk of the response body; returns the parts completed by it, each
   { headers, body } with lower-case header names and the exact body bytes. */
function parseMultipartChunk(state, chunk) {
  var parts = [];
  state.buf = concatBytes(state.buf, chunk);
  for (;;) {
    var buf = state.buf;
    if (state.mode === "done") {
      state.buf = new Uint8Array(0);
      break;
    }
    if (state.mode === "preamble") {
      var at = indexOfBytes(buf, state.delim, 0);
      if (at < 0) {
        state.buf = buf.subarray(Math.max(0, buf.length - state.delim.length + 1));
        break;
      }
      state.buf = buf.subarray(at + state.delim.length);
      state.mode = "headers";
      continue;
    }
    if (state.mode === "headers") {
      if (buf.length >= 2 && buf[0] === 45 && buf[1] === 45) {
        state.mode = "done";
        continue;
      }
      var end = indexOfBytes(buf, CRLF2, 0);
      if (end < 0) break;
      state.headers = parsePartHeaders(buf.subarray(0, end));
      var len = parseInt(state.headers["content-length"], 10);
      state.length = len >= 0 ? len : -1;
      state.buf = buf.subarray(end + 4);
      state.mode = "body";
      continue;
    }
    if (state.length >= 0) {
      if (buf.length < state.length) break;
      parts.push({ headers: state.headers, body: buf.slice(0, state.length) });
      state.buf = buf.subarray(state.length);
    } else {
      var stop = indexOfBytes(buf, state.closer, 0);
      if (stop < 0) break;
      parts.push({ headers: state.headers, body: buf.slice(0, stop) });
      state.buf = buf.subarray(stop + 2);
    }
    state.mode = "preamble";
    state.headers = null;
  }
  return parts;
}
/* parser:end */

/* video-block:start */
/* Video block: H.264 over a WebSocket (WS /video in docs/VIEWER-PROTOCOL.md). It is self-contained:
   paste it unchanged into another page. It reaches the page only through the object given to
   createVideoBlock(io), whose members are:
     io.socketUrl()          returns the ws or wss address of /video on the page's own origin
     io.accepts()            returns true while the latest status lists video in accepts
     io.picture()            returns the picture element (an img) the canvas stands in for. The canvas is
                             inserted after it with the same className, so the img needs a class that
                             carries its position and size (here: pic). Its style.display is toggled.
     io.onVideoConfig(c)     optional. c is { width, height, coverage, source }; called on every accepted
                             config, so the page can update its aspect ratio and coverage note
     io.onVideoStarted()     the first decoded frame is on screen: stop downloading the JPEG stream
     io.onVideoStopped(why)  video is gone (why is a short string) and the picture element shows again:
                             start the JPEG stream again
   It returns { update(), stop(), stats() }. Call update() once at start and whenever the status
   changes. Fallback: unsupported config, 3 decoder errors within 10 s, a closed socket, or accepts
   losing video all stop the block; it retries after 5 s only while io.accepts() is still true (an
   unsupported config is not retried until the page is reloaded). */
function createVideoBlock(io) {
  var RETRY_MS = 5000;
  var QUEUE_MAX = 3;
  var ERRORS_MAX = 3;
  var ERRORS_WINDOW_MS = 10000;
  var PENDING_MAX = 120;
  var sock = null;
  var decoder = null;
  var cfg = null;
  var cfgSeq = 0;
  var ready = false;
  var pending = [];
  var needKey = true;
  var keyAsked = false;
  var canvas = null;
  var ctx = null;
  var visible = false;
  var blocked = false;
  var retryTimer = 0;
  var errorTimes = [];
  var counts = {
    configs: 0, pictures: 0, frames: 0, ignored: 0, skipped: 0,
    errors: 0, keyRequests: 0, fallbacks: 0, hardware: "", lastReason: "", lastError: ""
  };

  function hasDecoder() {
    return typeof window.VideoDecoder === "function" && typeof window.EncodedVideoChunk === "function";
  }

  function sendKey() {
    if (!sock || sock.readyState !== 1) return;
    try {
      sock.send('{"type":"key"}');
      counts.keyRequests++;
    } catch (e) { /* the close handler follows */ }
  }

  function closeDecoder() {
    var d = decoder;
    decoder = null;
    if (d) {
      try { d.close(); } catch (e) { /* already closed */ }
    }
  }

  function clearRetry() {
    if (retryTimer) clearTimeout(retryTimer);
    retryTimer = 0;
  }

  /* Drop the socket and the decoder; if video was showing, put the picture element back. */
  function teardown(reason) {
    var s = sock;
    sock = null;
    if (s) {
      s.onmessage = null;
      s.onclose = null;
      s.onerror = null;
      try { s.close(); } catch (e) { /* already closed */ }
    }
    cfgSeq++;
    ready = false;
    pending = [];
    closeDecoder();
    if (visible) {
      visible = false;
      if (canvas) canvas.style.display = "none";
      var pic = io.picture();
      if (pic) pic.style.display = "";
      counts.fallbacks++;
      counts.lastReason = reason;
      io.onVideoStopped(reason);
    }
  }

  function fail(reason) {
    counts.lastReason = reason;
    teardown(reason);
    clearRetry();
    if (hasDecoder() && !blocked && io.accepts()) {
      retryTimer = setTimeout(function () {
        retryTimer = 0;
        update();
      }, RETRY_MS);
    }
  }

  function update() {
    var want = hasDecoder() && !blocked && !!io.accepts();
    if (!want) {
      clearRetry();
      if (sock || visible) teardown("not offered");
      return;
    }
    if (!sock && !retryTimer) open();
  }

  function stop() {
    clearRetry();
    teardown("stopped");
  }

  function open() {
    var s;
    try {
      s = new WebSocket(io.socketUrl());
      s.binaryType = "arraybuffer";
    } catch (e) {
      fail("socket");
      return;
    }
    sock = s;
    s.onmessage = function (ev) {
      if (sock !== s) return;
      if (typeof ev.data === "string") onText(ev.data);
      else onPicture(ev.data);
    };
    s.onclose = function () {
      if (sock !== s) return;
      sock = null;
      fail("closed");
    };
    s.onerror = function () { /* a close follows */ };
  }

  function positive(v) { return typeof v === "number" && isFinite(v) && v > 0; }

  function onText(text) {
    var m;
    try { m = JSON.parse(text); } catch (e) { return; }
    if (!m || typeof m !== "object" || m.type !== "config") return;
    if (typeof m.codec !== "string" || !positive(m.width) || !positive(m.height) ||
        typeof m.description !== "string" || m.description === "") {
      fail("bad config");
      return;
    }
    var description;
    try {
      var bin = atob(m.description);
      description = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) description[i] = bin.charCodeAt(i);
    } catch (e) {
      fail("bad config");
      return;
    }
    counts.configs++;
    var seq = ++cfgSeq;
    ready = false;
    pending = [];
    needKey = true;
    keyAsked = false;
    closeDecoder();
    var base = {
      codec: m.codec,
      codedWidth: Math.round(m.width),
      codedHeight: Math.round(m.height),
      description: description,
      optimizeForLatency: true
    };
    chooseConfig(base).then(function (chosen) {
      if (seq !== cfgSeq) return;
      if (!chosen) {
        blocked = true;
        fail("unsupported");
        return;
      }
      begin(chosen, m);
    }, function () {
      if (seq === cfgSeq) {
        blocked = true;
        fail("unsupported");
      }
    });
  }

  /* Hardware first, then whatever the browser has; null when neither is supported. */
  function chooseConfig(base) {
    var hw = Object.assign({}, base, { hardwareAcceleration: "prefer-hardware" });
    return window.VideoDecoder.isConfigSupported(hw).then(function (r) {
      if (r && r.supported) return hw;
      var any = Object.assign({}, base, { hardwareAcceleration: "no-preference" });
      return window.VideoDecoder.isConfigSupported(any).then(function (r2) {
        return r2 && r2.supported ? any : null;
      });
    });
  }

  function makeDecoder() {
    var d = new window.VideoDecoder({
      output: function (frame) { onFrame(frame, d); },
      error: function (err) { onDecoderError(err, d); }
    });
    return d;
  }

  function begin(chosen, m) {
    try {
      if (!canvas) {
        var pic = io.picture();
        canvas = document.createElement("canvas");
        canvas.className = pic.className;
        canvas.style.display = "none";
        canvas.setAttribute("aria-hidden", "true");
        pic.parentNode.insertBefore(canvas, pic.nextSibling);
        ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
      }
      if (canvas.width !== chosen.codedWidth) canvas.width = chosen.codedWidth;
      if (canvas.height !== chosen.codedHeight) canvas.height = chosen.codedHeight;
      cfg = chosen;
      counts.hardware = chosen.hardwareAcceleration;
      decoder = makeDecoder();
      decoder.configure(chosen);
    } catch (e) {
      counts.lastError = String(e && e.message ? e.message : e);
      fail("decoder");
      return;
    }
    ready = true;
    if (typeof io.onVideoConfig === "function") {
      io.onVideoConfig({
        width: chosen.codedWidth,
        height: chosen.codedHeight,
        coverage: typeof m.coverage === "string" ? m.coverage : "",
        source: typeof m.source === "string" ? m.source : ""
      });
    }
    var queued = pending;
    pending = [];
    for (var i = 0; i < queued.length; i++) feed(queued[i]);
  }

  function onPicture(buf) {
    if (!(buf instanceof ArrayBuffer) || buf.byteLength <= 8) return;
    var head = new DataView(buf, 0, 8);
    var item = {
      key: (head.getUint8(0) & 1) === 1,
      ms: head.getUint32(4, false),
      data: new Uint8Array(buf, 8)
    };
    if (ready) {
      feed(item);
    } else {
      /* Configuring still: keep the pictures, but if it takes too long start over at a key frame. */
      if (pending.length >= PENDING_MAX) {
        pending = [];
        needKey = true;
      }
      pending.push(item);
    }
  }

  function feed(item) {
    if (!decoder || decoder.state !== "configured") return;
    if (item.key) {
      needKey = false;
      keyAsked = false;
    } else {
      if (needKey) {
        counts.ignored++;
        return;
      }
      if (decoder.decodeQueueSize > QUEUE_MAX) {
        needKey = true;
        counts.skipped++;
        if (!keyAsked) {
          keyAsked = true;
          sendKey();
        }
        return;
      }
    }
    try {
      decoder.decode(new window.EncodedVideoChunk({
        type: item.key ? "key" : "delta",
        timestamp: item.ms * 1000,
        data: item.data
      }));
      counts.pictures++;
    } catch (e) {
      onDecoderError(e, decoder);
    }
  }

  function onFrame(frame, d) {
    try {
      if (d !== decoder || !ctx) return;
      ctx.drawImage(frame, 0, 0);
      counts.frames++;
      if (!visible) {
        visible = true;
        canvas.style.display = "";
        var pic = io.picture();
        if (pic) pic.style.display = "none";
        io.onVideoStarted();
      }
    } finally {
      frame.close();
    }
  }

  /* A decoder error: reset, ask for a key frame and wait for it; too many errors give up. */
  function onDecoderError(err, d) {
    if (d !== decoder) return;
    counts.errors++;
    counts.lastError = String(err && err.message ? err.message : err);
    var now = Date.now();
    errorTimes.push(now);
    errorTimes = errorTimes.filter(function (t) { return now - t <= ERRORS_WINDOW_MS; });
    if (errorTimes.length >= ERRORS_MAX) {
      fail("decoder errors");
      return;
    }
    try {
      if (d.state === "closed") {
        decoder = makeDecoder();
        decoder.configure(cfg);
      } else {
        d.reset();
        d.configure(cfg);
      }
    } catch (e) {
      fail("decoder");
      return;
    }
    needKey = true;
    keyAsked = true;
    sendKey();
  }

  return {
    update: update,
    stop: stop,

    if (!drag || ev.pointerId !== drag.id) return;
    var p = fractionOf(ev);
    drag.pts.push([Math.max(0, Math.round(ev.timeStamp - drag.t0)), p[0], p[1]]);
    var points = drag.pts;
    drag = null;
    var sent = send({ type: "gesture", points: points });
    var tap = isTapPath(points);
    if (!tap) {
      drawTrail(points);
      clearTimeout(trailTimer);
      trailTimer = setTimeout(clearTrail, TRAIL_CLEAR_MS);
    }
    /* A tap or long press shows its ring at once; a drag has no single point. */
    if (sent && (accepts.tap || accepts.longPress) && tap) {
      var end = points[points.length - 1];
      addPending(end[1], end[2]);
    }
  });
  frame.addEventListener("pointercancel", function (ev) {
    if (drag && ev.pointerId === drag.id) {
      drag = null;
      clearTrail();
    }
  });

  /* Mouse wheel: events within 120 ms become one scroll. Each share is held to 0.8 of the
     frame (so a fast fling can't ask for more than the phone's screen), which also keeps it
     inside the protocol's -1..1. A scroll that comes to nothing is not sent. */
  var WHEEL_MAX = 0.8;
  var wheel = null;
  function share(v) {
    return round4(Math.max(-WHEEL_MAX, Math.min(WHEEL_MAX, v)));
  }
  function flushWheel() {
    var w = wheel;
    wheel = null;
    if (!w) return;
    var dx = share(w.dx);
    var dy = share(w.dy);
    if (dx === 0 && dy === 0) return;
    send({ type: "scroll", x: round4(w.x), y: round4(w.y), dx: dx, dy: dy });
  }
  frame.addEventListener("wheel", function (ev) {
    if (!accepts.scroll) return;
    ev.preventDefault();
    var r = frame.getBoundingClientRect();
    var k = ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? r.height : 1;
    if (!wheel) {
      wheel = {
        x: clamp01((ev.clientX - r.left) / Math.max(1, r.width)),
        y: clamp01((ev.clientY - r.top) / Math.max(1, r.height)),
        dx: 0,
        dy: 0
      };
      setTimeout(flushWheel, 120);
    }
    wheel.dx += (ev.deltaX * k) / Math.max(1, r.width);
    wheel.dy += (ev.deltaY * k) / Math.max(1, r.height);
  }, { passive: false });

  /* Keyboard and paste: only when the page itself has focus, not a toolbar control. */
  var typed = "";
  var typedTimer = 0;
  function flushText() {
    clearTimeout(typedTimer);
    typedTimer = 0;
    if (!typed) return;
    var t = typed;
    typed = "";
    send({ type: "text", text: t });
  }
  function inToolbar(target) {
    return !!(target && target.closest && target.closest("#bar"));
  }
  document.addEventListener("keydown", function (ev) {
    if (ev.defaultPrevented || ev.isComposing) return;
    if (inToolbar(ev.target)) {
      if (ev.key === "Escape") letGo(document.activeElement);
      return;
    }
    /* Ctrl, Alt and Meta make shortcuts, which stay the browser's. But AltGr (Alt Gr on a
       Windows layout reports Ctrl and Alt together) types characters such as @ or a with an
       accent, and those go to the phone. */
    var altGr = typeof ev.getModifierState === "function" && ev.getModifierState("AltGraph");
    if (ev.metaKey || ((ev.ctrlKey || ev.altKey) && !altGr)) return;
    if (ev.key === "Backspace" && accepts.backspace) {
      ev.preventDefault();
      flushText();
      send({ type: "key", key: "backspace" });
    } else if (ev.key === "Enter" && accepts.enter) {
      ev.preventDefault();
      flushText();
      send({ type: "key", key: "enter" });
    } else if (accepts.text && Array.from(ev.key).length === 1) {
      ev.preventDefault();
      typed += ev.key;
      clearTimeout(typedTimer);
      typedTimer = setTimeout(flushText, 300);
    }
  });
  document.addEventListener("paste", function (ev) {
    if (!accepts.text || inToolbar(ev.target)) return;
    var text = ev.clipboardData ? ev.clipboardData.getData("text") : "";
    if (!text) return;
    ev.preventDefault();
    flushText();
    send({ type: "text", text: text });
  });

  /* Video: the self-contained block above, wired to this page. */
  var video = createVideoBlock({
    socketUrl: function () { return endpoint("/video", true); },
    accepts: function () { return !!accepts.video; },
    picture: function () { return screenEl; },
    onVideoConfig: function (c) {
      shown.rev = null;
      shown.size = null;
      shown.coverage = c.coverage || "";
      shown.natural = { w: c.width, h: c.height };
      layout();
      drawOverlay();
      renderStatus();
    },
    onVideoStarted: function () {
      videoOn = true;
      setStream(false);
      streamLive = false;
      haveFrame = true;
      frame.classList.add("has-frame");
      layout();
      startVideoFps();
      renderStatus();
    },
    onVideoStopped: function () {
      videoOn = false;
      stopVideoFps();
      setStream(true);
      renderStatus();
    }
  });

  /* While video shows, the status line's rate is the video's own: frames drawn in the last second.
     (The server's fps is its JPEG stream's.) */
  function startVideoFps() {
    stopVideoFps();
    var last = video.stats().frames;
    var lastAt = Date.now();
    videoFps = null;
    videoFpsTimer = setInterval(function () {
      var now = Date.now();
      var frames = video.stats().frames;
      var seconds = (now - lastAt) / 1000;
      if (seconds > 0) videoFps = Math.max(0, (frames - last) / seconds);
      last = frames;
      lastAt = now;
      renderStatus();
    }, 1000);
  }
  function stopVideoFps() {
    if (videoFpsTimer !== null) clearInterval(videoFpsTimer);
    videoFpsTimer = null;
    videoFps = null;
  }

  layout();
  renderStatus();
  connectWs();
  runStream();
})();
</script>
</body>
</html>
