<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tapwright live view</title>
<style>
  :root {
    --bg: #f4f4f5; --panel: #ffffff; --fg: #18181b; --muted: #52525b; --line: #d4d4d8;
    --agent: #2563eb; --person: #d97706; --bad: #dc2626; --on-bad: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #09090b; --panel: #18181b; --fg: #e4e4e7; --muted: #a1a1aa; --line: #3f3f46;
            --agent: #60a5fa; --person: #fbbf24; --bad: #f87171; --on-bad: #18181b; }
  }
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
           padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  button, select, label.toggle { font: inherit; color: var(--fg); background: var(--bg);
           border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  label.toggle { display: inline-flex; align-items: center; gap: 6px; }
  [hidden] { display: none !important; }
  #status { padding: 6px 16px; text-align: center; color: var(--muted); font-size: 13px; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 16px 16px; }
  #phone { position: relative; line-height: 0; width: var(--pw, 9px); height: var(--ph, 19px);
           touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  /* the JPEG picture and the video canvas share this class; fit() sets --pw and --ph on #phone */
  .pic { display: block; width: var(--pw, 9px); height: var(--ph, 19px); border-radius: 16px;
         box-shadow: 0 0 0 1px var(--line); background: #000;
         touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; }
  #marks { position: absolute; left: 0; top: 0; pointer-events: none; }
  #toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: calc(100% - 32px);
           padding: 8px 14px; border-radius: 8px; background: var(--bad); color: var(--on-bad); }
  @media (pointer: coarse) { button, select, label.toggle { min-height: 44px; } }
</style>
</head>
<body>
<header>
  <button type="button" data-accept="home" data-button="home">Home</button>
  <button type="button" data-accept="volume" data-button="volumeDown">Volume −</button>
  <button type="button" data-accept="volume" data-button="volumeUp">Volume +</button>
  <label class="toggle"><input type="checkbox" id="pause"> Pause agent</label>
  <select id="quality" data-accept="quality" aria-label="Stream quality">
    <option value="sharp">Sharp</option>
    <option value="balanced" selected>Balanced</option>
    <option value="light">Light</option>
  </select>
</header>
<div id="status"><span id="state" aria-live="polite">Connecting…</span><span id="fps"></span></div>
<main><div id="phone"><img id="screen" class="pic" alt="The phone's screen, live" draggable="false"><canvas id="marks" aria-hidden="true"></canvas></div></main>
<div id="toast" role="alert" hidden></div>
<script>
"use strict";
if (location.search) history.replaceState(null, "", location.pathname);
const img = document.getElementById("screen");
const marks = document.getElementById("marks");
const ctx = marks.getContext("2d");
const stateEl = document.getElementById("state");
const fpsEl = document.getElementById("fps");
const toastEl = document.getElementById("toast");
const pauseEl = document.getElementById("pause");
const qualityEl = document.getElementById("quality");
const mainEl = document.querySelector("main");
const phone = document.getElementById("phone");
const STATES = { live: "Live", connecting: "Connecting", reconnecting: "Reconnecting", locked: "Phone locked", "not-answering": "App not answering", "no-device": "No phone" };
const VIA = { usb: "USB", wifi: "Wi-Fi", tailscale: "Tailscale" };
const DRIVERS = { agent: "Agent driving", person: "You're driving" };
let ws = null;
let wsDelay = 500;
let everOpened = false;
let videoAccepted = false; // the latest status lists "video" in accepts
let videoOn = false;       // the video canvas is the picture on screen
let videoSize = null;      // { w, h } from the video config
let lastSize = null;       // size of the last JPEG picture
const BLANK = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
function wsUrl(path) { return (location.protocol === "https:" ? "wss://" : "ws://") + location.host + path; }

// ---- the picture ----
// Whichever picture element is showing: the img, or the canvas while video plays.
function shownPic() { return (videoOn && phone.querySelector("canvas.pic")) || img; }
function startStream() { if (!videoOn) img.src = "/stream?t=" + Date.now(); }
img.addEventListener("error", () => { if (!videoOn) setTimeout(startStream, 1000); });
let applied = "";
function fit() {
  if (!videoOn && img.naturalWidth > 1) lastSize = { w: img.naturalWidth, h: img.naturalHeight };
  const size = videoOn && videoSize ? videoSize : lastSize;
  const w = size ? size.w : 9, h = size ? size.h : 19.5;
  const box = mainEl.getBoundingClientRect();
  const scale = Math.max(0.05, Math.min((box.width - 32) / w, (box.height - 16) / h));
  const cw = Math.floor(w * scale), ch = Math.floor(h * scale);
  const d = window.devicePixelRatio || 1;
  const key = cw + "x" + ch + "@" + d;
  if (key === applied) return;
  applied = key;
  phone.style.setProperty("--pw", cw + "px");
  phone.style.setProperty("--ph", ch + "px");
  marks.width = Math.round(cw * d);
  marks.height = Math.round(ch * d);
  marks.style.width = cw + "px";
  marks.style.height = ch + "px";
  ctx.setTransform(marks.width / cw, 0, 0, marks.height / ch, 0, 0);
}
new ResizeObserver(fit).observe(mainEl);
setInterval(fit, 500);
startStream();

// ---- status, actions, errors (server text goes in as textContent only) ----
let lastPaused = false;
let lastQuality = "balanced";
function showStatus(s) {
  if (Array.isArray(s.accepts)) {
    const accepts = new Set(s.accepts);
    document.querySelectorAll("[data-accept]").forEach((el) => { el.hidden = !accepts.has(el.dataset.accept); });
    videoAccepted = accepts.has("video");
  }
  lastPaused = !!s.paused;
  if (s.quality) lastQuality = s.quality;
  if (document.activeElement !== pauseEl) pauseEl.checked = lastPaused;
  if (document.activeElement !== qualityEl) qualityEl.value = lastQuality;
  const parts = [STATES[s.state] || String(s.state)];
  if (s.via) parts.push(VIA[s.via] || String(s.via));
  parts.push(s.paused ? "Agent paused" : (DRIVERS[s.driver] || "Idle"));
  if (s.detail) parts.push(String(s.detail));
  stateEl.textContent = parts.join(" · ");
  fpsEl.textContent = s.state === "live" ? " · " + Math.round(s.fps || 0) + " fps" : "";
  video.update();
}
let toastTimer = 0;
function toast(text) {
  toastEl.textContent = text;
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, 4000);
}
function color(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
let clearTimer = 0;
function clearSoon(ms) {
  clearTimeout(clearTimer);
  clearTimer = setTimeout(() => ctx.clearRect(0, 0, marks.clientWidth, marks.clientHeight), ms);
}
function showAction(a) {
  if (!a.point) return;
  ctx.beginPath();
  ctx.arc(a.point.x * marks.clientWidth, a.point.y * marks.clientHeight, 14, 0, Math.PI * 2);
  ctx.lineWidth = 3;
  ctx.strokeStyle = a.ok === false ? color("--bad") : color(a.by === "person" ? "--person" : "--agent");
  ctx.stroke();
  clearSoon(700);
}
function handle(m) {
  if (m.type === "status") showStatus(m);
  else if (m.type === "action") showAction(m);
  else if (m.type === "error") toast(String(m.message || m.code || "Something went wrong"));
}

// ---- video (H.264 over WS /video): the shared block, then this page's wiring ----
/* video-block:start */
/* Video block: H.264 over a WebSocket (WS /video in docs/VIEWER-PROTOCOL.md). It is self-contained:
   paste it unchanged into another page. It reaches the page only through the object given to
   createVideoBlock(io), whose members are:
     io.socketUrl()          returns the ws or wss address of /video on the page's own origin
     io.accepts()            returns true while the latest status lists video in accepts
     io.picture()            returns the picture element (an img) the canvas stands in for. The canvas is
                             inserted after it with the same className, so the img needs a class that
                             carries its position and size (here: pic). Its style.display is toggled.
     io.onVideoConfig(c)     optional. c is { width, height, coverage, source }; called on every accepted
                             config, so the page can update its aspect ratio and coverage note
     io.onVideoStarted()     the first decoded frame is on screen: stop downloading the JPEG stream
     io.onVideoStopped(why)  video is gone (why is a short string) and the picture element shows again:
                             start the JPEG stream again
   It returns { update(), stop(), stats() }. Call update() once at start and whenever the status
   changes. Fallback: unsupported config, 3 decoder errors within 10 s, a closed socket, or accepts
   losing video all stop the block; it retries after 5 s only while io.accepts() is still true (an
   unsupported config is not retried until the page is reloaded). */
function createVideoBlock(io) {
  var RETRY_MS = 5000;
  var QUEUE_MAX = 3;
  var ERRORS_MAX = 3;
  var ERRORS_WINDOW_MS = 10000;
  var PENDING_MAX = 120;
  var sock = null;
  var decoder = null;
  var cfg = null;
  var cfgSeq = 0;
  var ready = false;
  var pending = [];
  var needKey = true;
  var keyAsked = false;
  var canvas = null;
  var ctx = null;
  var visible = false;
  var blocked = false;
  var retryTimer = 0;
  var errorTimes = [];
  var counts = {
    configs: 0, pictures: 0, frames: 0, ignored: 0, skipped: 0,
    errors: 0, keyRequests: 0, fallbacks: 0, hardware: "", lastReason: "", lastError: ""
  };

  function hasDecoder() {
    return typeof window.VideoDecoder === "function" && typeof window.EncodedVideoChunk === "function";
  }

  function sendKey() {
    if (!sock || sock.readyState !== 1) return;
    try {
      sock.send('{"type":"key"}');
      counts.keyRequests++;
    } catch (e) { /* the close handler follows */ }
  }

  function closeDecoder() {
    var d = decoder;
    decoder = null;
    if (d) {
      try { d.close(); } catch (e) { /* already closed */ }
    }
  }

  function clearRetry() {
    if (retryTimer) clearTimeout(retryTimer);
    retryTimer = 0;
  }

  /* Drop the socket and the decoder; if video was showing, put the picture element back. */
  function teardown(reason) {
    var s = sock;
    sock = null;
    if (s) {
      s.onmessage = null;
      s.onclose = null;
      s.onerror = null;
      try { s.close(); } catch (e) { /* already closed */ }
    }
    cfgSeq++;
    ready = false;
    pending = [];
    closeDecoder();
    if (visible) {
      visible = false;
      if (canvas) canvas.style.display = "none";
      var pic = io.picture();
      if (pic) pic.style.display = "";
      counts.fallbacks++;
      counts.lastReason = reason;
      io.onVideoStopped(reason);
    }
  }

  function fail(reason) {
    counts.lastReason = reason;
    teardown(reason);
    clearRetry();
    if (hasDecoder() && !blocked && io.accepts()) {
      retryTimer = setTimeout(function () {
        retryTimer = 0;
        update();
      }, RETRY_MS);
    }
  }

  function update() {
    var want = hasDecoder() && !blocked && !!io.accepts();
    if (!want) {
      clearRetry();
      if (sock || visible) teardown("not offered");
      return;
    }
    if (!sock && !retryTimer) open();
  }

  function stop() {
    clearRetry();
    teardown("stopped");
  }

  function open() {
    var s;
    try {
      s = new WebSocket(io.socketUrl());
      s.binaryType = "arraybuffer";
    } catch (e) {
      fail("socket");
      return;
    }
    sock = s;
    s.onmessage = function (ev) {
      if (sock !== s) return;
      if (typeof ev.data === "string") onText(ev.data);
      else onPicture(ev.data);
    };
    s.onclose = function () {
      if (sock !== s) return;
      sock = null;
      fail("closed");
    };
    s.onerror = function () { /* a close follows */ };
  }

  function positive(v) { return typeof v === "number" && isFinite(v) && v > 0; }

  function onText(text) {
    var m;
    try { m = JSON.parse(text); } catch (e) { return; }
    if (!m || typeof m !== "object" || m.type !== "config") return;
    if (typeof m.codec !== "string" || !positive(m.width) || !positive(m.height) ||
        typeof m.description !== "string" || m.description === "") {
      fail("bad config");
      return;
    }
    var description;
    try {
      var bin = atob(m.description);
      description = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) description[i] = bin.charCodeAt(i);
    } catch (e) {
      fail("bad config");
      return;
    }
    counts.configs++;
    var seq = ++cfgSeq;
    ready = false;
    pending = [];
    needKey = true;
    keyAsked = false;
    closeDecoder();
    var base = {
      codec: m.codec,
      codedWidth: Math.round(m.width),
      codedHeight: Math.round(m.height),
      description: description,
      optimizeForLatency: true
    };
    chooseConfig(base).then(function (chosen) {
      if (seq !== cfgSeq) return;
      if (!chosen) {
        blocked = true;
        fail("unsupported");
        return;
      }
      begin(chosen, m);
    }, function () {
      if (seq === cfgSeq) {
        blocked = true;
        fail("unsupported");
      }
    });
  }

  /* Hardware first, then whatever the browser has; null when neither is supported. */
  function chooseConfig(base) {
    var hw = Object.assign({}, base, { hardwareAcceleration: "prefer-hardware" });
    return window.VideoDecoder.isConfigSupported(hw).then(function (r) {
      if (r && r.supported) return hw;
      var any = Object.assign({}, base, { hardwareAcceleration: "no-preference" });
      return window.VideoDecoder.isConfigSupported(any).then(function (r2) {
        return r2 && r2.supported ? any : null;
      });
    });
  }

  function makeDecoder() {
    var d = new window.VideoDecoder({
      output: function (frame) { onFrame(frame, d); },
      error: function (err) { onDecoderError(err, d); }
    });
    return d;
  }

  function begin(chosen, m) {
    try {
      if (!canvas) {
        var pic = io.picture();
        canvas = document.createElement("canvas");
        canvas.className = pic.className;
        canvas.style.display = "none";
        canvas.setAttribute("aria-hidden", "true");
        pic.parentNode.insertBefore(canvas, pic.nextSibling);
        ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
      }
      if (canvas.width !== chosen.codedWidth) canvas.width = chosen.codedWidth;
      if (canvas.height !== chosen.codedHeight) canvas.height = chosen.codedHeight;
      cfg = chosen;
      counts.hardware = chosen.hardwareAcceleration;
      decoder = makeDecoder();
      decoder.configure(chosen);
    } catch (e) {
      counts.lastError = String(e && e.message ? e.message : e);
      fail("decoder");
      return;
    }
    ready = true;
    if (typeof io.onVideoConfig === "function") {
      io.onVideoConfig({
        width: chosen.codedWidth,
        height: chosen.codedHeight,
        coverage: typeof m.coverage === "string" ? m.coverage : "",
        source: typeof m.source === "string" ? m.source : ""
      });
    }
    var queued = pending;
    pending = [];
    for (var i = 0; i < queued.length; i++) feed(queued[i]);
  }

  function onPicture(buf) {
    if (!(buf instanceof ArrayBuffer) || buf.byteLength <= 8) return;
    var head = new DataView(buf, 0, 8);
    var item = {
      key: (head.getUint8(0) & 1) === 1,
      ms: head.getUint32(4, false),
      data: new Uint8Array(buf, 8)
    };
    if (ready) {
      feed(item);
    } else {
      /* Configuring still: keep the pictures, but if it takes too long start over at a key frame. */
      if (pending.length >= PENDING_MAX) {
        pending = [];
        needKey = true;
      }
      pending.push(item);
    }
  }

  function feed(item) {
    if (!decoder || decoder.state !== "configured") return;
    if (item.key) {
      needKey = false;
      keyAsked = false;
    } else {
      if (needKey) {
        counts.ignored++;
        return;
      }
      if (decoder.decodeQueueSize > QUEUE_MAX) {
        needKey = true;
        counts.skipped++;
        if (!keyAsked) {
          keyAsked = true;
          sendKey();
        }
        return;
      }
    }
    try {
      decoder.decode(new window.EncodedVideoChunk({
        type: item.key ? "key" : "delta",
        timestamp: item.ms * 1000,
        data: item.data
      }));
      counts.pictures++;
    } catch (e) {
      onDecoderError(e, decoder);
    }
  }

  function onFrame(frame, d) {
    try {
      if (d !== decoder || !ctx) return;
      ctx.drawImage(frame, 0, 0);
      counts.frames++;
      if (!visible) {
        visible = true;
        canvas.style.display = "";
        var pic = io.picture();
        if (pic) pic.style.display = "none";
        io.onVideoStarted();
      }
    } finally {
      frame.close();
    }
  }

  /* A decoder error: reset, ask for a key frame and wait for it; too many errors give up. */
  function onDecoderError(err, d) {
    if (d !== decoder) return;
    counts.errors++;
    counts.lastError = String(err && err.message ? err.message : err);
    var now = Date.now();
    errorTimes.push(now);
    errorTimes = errorTimes.filter(function (t) { return now - t <= ERRORS_WINDOW_MS; });
    if (errorTimes.length >= ERRORS_MAX) {
      fail("decoder errors");
      return;
    }
    try {
      if (d.state === "closed") {
        decoder = makeDecoder();
        decoder.configure(cfg);
      } else {
        d.reset();
        d.configure(cfg);
      }
    } catch (e) {
      fail("decoder");
      return;
    }
    needKey = true;
    keyAsked = true;
    sendKey();
  }

  return {
    update: update,
    stop: stop,
    stats: function () {
      return {
        configs: counts.configs, pictures: counts.pictures, frames: counts.frames,
        ignored: counts.ignored, skipped: counts.skipped, errors: counts.errors,
        keyRequests: counts.keyRequests, fallbacks: counts.fallbacks, hardware: counts.hardware,
        lastReason: counts.lastReason, lastError: counts.lastError, active: visible
      };
    }
  };
}
/* video-block:end */
const video = createVideoBlock({
  socketUrl: () => wsUrl("/video"),
  accepts: () => videoAccepted,
  picture: () => img,
  onVideoConfig: (c) => { videoSize = { w: c.width, h: c.height }; if (videoOn) fit(); },
  onVideoStarted: () => {
    videoOn = true;
    img.src = BLANK; // stop downloading /stream; a data image never fires "error"
    fit();
  },
  onVideoStopped: () => {
    videoOn = false;
    videoSize = null;
    startStream();
    fit();
  }
});
video.update();

// ---- the connection for input and status ----
function connect() {
  ws = new WebSocket(wsUrl("/ws"));
  ws.onopen = () => { wsDelay = 500; if (everOpened) startStream(); everOpened = true; };
  ws.onmessage = (e) => { try { handle(JSON.parse(e.data)); } catch (err) { /* skip what we can't read */ } };
  ws.onclose = () => {
    stateEl.textContent = "Not connected to tapwright serve; retrying…";
    fpsEl.textContent = "";
    setTimeout(connect, wsDelay);
    wsDelay = Math.min(wsDelay * 2, 5000);
  };
}
function send(m) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return false;
  ws.send(JSON.stringify(m));
  return true;
}
connect();

// ---- pointer: taps, long presses, drags ----
let path = null;
let activeId = null;
let t0 = 0;
function point(e) {
  const r = shownPic().getBoundingClientRect();
  const x = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
  const y = Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1);
  return [Math.round(performance.now() - t0), +x.toFixed(4), +y.toFixed(4)];
}
function drawTrail() {
  const w = marks.clientWidth, h = marks.clientHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.beginPath();
  path.forEach(([, x, y], i) => (i ? ctx.lineTo(x * w, y * h) : ctx.moveTo(x * w, y * h)));
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = color("--person");
  ctx.stroke();
}
// Input is heard on #phone, so it works the same on the img and on the video canvas.
phone.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || activeId !== null) return;
  e.preventDefault();
  activeId = e.pointerId;
  phone.setPointerCapture(e.pointerId);
  t0 = performance.now();
  path = [point(e)];
  clearTimeout(clearTimer);
});
phone.addEventListener("pointermove", (e) => {
  if (!path || e.pointerId !== activeId) return;
  const p = point(e);
  if (p[0] - path[path.length - 1][0] >= 16) { path.push(p); drawTrail(); }
});
phone.addEventListener("pointerup", (e) => {
  if (!path || e.pointerId !== activeId) return;
  path.push(point(e));
  send({ type: "gesture", points: path });
  drawTrail();
  clearSoon(400);
  path = null;
  activeId = null;
});
phone.addEventListener("pointercancel", (e) => {
  if (e.pointerId !== activeId) return;
  path = null;
  activeId = null;
  clearSoon(0);
});
phone.addEventListener("contextmenu", (e) => e.preventDefault());

// ---- wheel: scrolls ----
let wheel = null;
const clampShare = (v) => Math.max(-0.8, Math.min(0.8, v));
phone.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = shownPic().getBoundingClientRect();
  const unit = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? r.height : 1;
  if (!wheel) {
    const [, x, y] = point(e);
    wheel = { x, y, dx: 0, dy: 0 };
    setTimeout(() => {
      const w = wheel;
      wheel = null;
      const dx = +clampShare(w.dx).toFixed(4), dy = +clampShare(w.dy).toFixed(4);
      if (dx || dy) send({ type: "scroll", x: w.x, y: w.y, dx, dy });
    }, 150);
  }
  wheel.dx += (e.deltaX * unit) / r.width;
  wheel.dy += (e.deltaY * unit) / r.height;
}, { passive: false });

// ---- keyboard: typing into the phone's focused field ----
let typed = "";
let typeTimer = 0;
function flushText() {
  clearTimeout(typeTimer);
  if (typed) { send({ type: "text", text: typed }); typed = ""; }
}
document.addEventListener("keydown", (e) => {
  if (e.isComposing) return;
  if (e.target.closest && e.target.closest("header")) {
    if (e.key === "Escape" && document.activeElement) document.activeElement.blur();
    return;
  }
  const altGr = e.getModifierState && e.getModifierState("AltGraph");
  if ((e.ctrlKey || e.metaKey || e.altKey) && !altGr) return; // shortcuts; pasting arrives as a paste event
  if (e.key === "Backspace" || e.key === "Enter") {
    e.preventDefault();
    flushText();
    send({ type: "key", key: e.key === "Enter" ? "enter" : "backspace" });
  } else if (e.key.length === 1) {
    e.preventDefault();
    typed += e.key;
    clearTimeout(typeTimer);
    typeTimer = setTimeout(flushText, 150);
  }
});
document.addEventListener("paste", (e) => {
  const text = e.clipboardData ? e.clipboardData.getData("text") : "";
  if (text) { e.preventDefault(); flushText(); send({ type: "text", text }); }
});

// ---- toolbar (pointer clicks let go of focus so typing keeps reaching the phone; keyboard users keep theirs) ----
let viaPointer = false;
window.addEventListener("pointerdown", () => { viaPointer = true; }, true);
window.addEventListener("keydown", () => { viaPointer = false; }, true);
function release(el) { if (viaPointer) el.blur(); }
function offline() { toast("Not connected to tapwright serve"); }
document.querySelectorAll("[data-button]").forEach((b) => b.addEventListener("click", () => {
  send({ type: "button", name: b.dataset.button });
  release(b);
}));
pauseEl.addEventListener("change", () => {
  if (!send({ type: "pause", on: pauseEl.checked })) { pauseEl.checked = lastPaused; offline(); }
  release(pauseEl);
});
qualityEl.addEventListener("change", () => {
  if (!send({ type: "quality", preset: qualityEl.value })) { qualityEl.value = lastQuality; offline(); }
  release(qualityEl);
});
</script>
</body>
